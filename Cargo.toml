[package]
name = "QKTHR"
version = "0.1.0"
edition = "2021"

[dependencies]
ldap3 = "0.9"
base64 = "0.21"
sha1 = "0.10"
urlencoding = "2.1"
chrono = "0.4"
regex = "1.9"
rand = "0.8"
shellexpand = "2.1"
which = "4.4"
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
openssl = { version = "0.10", features = ["vendored"] }
p12-keystore = "0.3"
md5 = "0.7.0"
clap = { version = "4.0", features = ["derive"] }
reqwest = { version = "0.11", features = ["blocking", "rustls-tls", "json"] }
log = "0.4"
env_logger = "0.11"
